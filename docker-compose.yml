services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facegroup-ui
    ports:
      - "5173:5173"
    environment:
      # Override with your real backend URL when connecting to an API
      - VITE_API_URL=http://localhost:8000/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Uncomment when connecting a real backend ─────────────────────────────
  # backend:
  #   image: your-backend-image
  #   container_name: facegroup-backend
  #   ports:
  #     - "8000:8000"
  #   restart: unless-stopped
